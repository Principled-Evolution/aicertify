name: AICertify CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  basic-checks:
    runs-on: ubuntu-latest

    steps:
      # The gopal policy library is a submodule, and the tests that matter most
      # read it: which decision rule each policy publishes, and whether a true
      # verdict means compliant or means a concern was detected. Without it,
      # those tests were passing vacuously against an empty index.
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"  # Updated to match project requirements

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: poetry install

      - name: Run Code Linting with Pre-commit
        run: |
          poetry run pre-commit run --all-files

      - name: Verify Package Installation
        run: |
          poetry run python -c "import aicertify; print(f'AICertify version: {aicertify.__version__}')"

      # The GOPAL playground scores model cards in the browser from this
      # exported rubric. A stale export means the site publishes a different
      # number from `aicertify score-card` for the same card.
      - name: Check the exported model-card rubric is current
        run: poetry run python scripts/export_model_card_rubric.py --check

      - name: Run Basic Tests
        run: poetry run pytest tests/ -v
