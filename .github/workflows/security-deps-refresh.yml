name: Security dependency refresh

on:
  push:
    branches:
      - security/dependabot-alerts-2026-09-03

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install 'poetry==2.4.1'

      - name: Raise security floors and refresh lockfile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pyproject.toml')
          s = p.read_text()
          s = s.replace('"pypdf>=6.15.0"', '"pypdf>=6.16.1"')
          s = s.replace('"nltk>=3.10.0"', '"nltk>=3.10.3"')
          s = s.replace('"banks>=2.4.2"', '"banks>=2.4.5"')
          p.write_text(s)
          PY
          poetry lock
          poetry check

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/security-deps-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml poetry.lock .github/workflows/security-deps-refresh.yml
          git commit -m 'security: refresh pypdf and banks fixes'
          git push
